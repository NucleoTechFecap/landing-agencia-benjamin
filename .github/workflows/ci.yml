name: CI

on:
  pull_request:
    branches:
      - main
      - production
  push:
    branches:
      - main
      - production
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks and production build
        run: npm run verify

  release-source:
    name: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main as the production release source
        if: github.event_name == 'pull_request' && github.base_ref == 'production'
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$PR_HEAD_REF" != "main" ]]; then
            echo "Production releases must come from a pull request with main as the source branch."
            exit 1
          fi
          echo "Release source is main."

      - name: Skip source validation outside production pull requests
        if: github.event_name != 'pull_request' || github.base_ref != 'production'
        run: echo "Source validation applies only to pull requests targeting production."

  release-content:
    name: release-content
    if: github.event_name == 'push' && github.ref == 'refs/heads/production' || github.event_name == 'pull_request' && github.base_ref == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject provisional release content
        run: npm run check:release-content
