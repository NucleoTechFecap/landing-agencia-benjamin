<h2>Redefinir a senha do painel da Agência Benjamin</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta no painel do site.</p>
<p>
  <a href="{{ .SiteURL }}/admin/auth/callback?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/admin/nova-senha"
    >Definir uma nova senha</a
  >
</p>
<p>O link vale por 1 hora e funciona uma única vez.</p>
<p>Se você não pediu a troca, ignore este e-mail: a senha atual continua valendo.</p>
